name: Construire APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restaurer le modèle HTML compacté
        run: |
          mkdir -p build www
          python - <<'PY'
          from pathlib import Path
          import base64, lzma
          encoded = b''.join(p.read_bytes() for p in sorted(Path('source/template-parts').glob('part-*')))
          Path('build/template.html').write_bytes(lzma.decompress(base64.b85decode(encoded)))
          PY

      - name: Reconstituer et vérifier l'icône et le splash
        run: |
          mkdir -p build/branding
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('assets/branding-parts')
          targets = [
              ('icon.jpg', 'icon-*.txt', 'e930eac7db921c16c8ab5d23f10d957f16f821fb499cf1626fb22796c7faab80'),
              ('splash.jpg', 'splash-*.txt', '1147116a9609b880c1ccaffa125916526a81d895c732b7c1b86f5da5ab88e7ad'),
          ]
          for filename, pattern, expected in targets:
              parts = sorted(root.glob(pattern))
              if not parts:
                  raise SystemExit(f'Aucun morceau trouvé pour {filename}')
              encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{filename} invalide: SHA256 {actual} != {expected}')
              out = Path('build/branding') / filename
              out.write_bytes(data)
              print(f'✓ {filename}: {len(data)} octets, SHA256 vérifié')
          PY

      - name: Télécharger les modèles et véhicules officiels Kenney
        run: |
          set -euxo pipefail
          mkdir -p build/packs/{market,characters,building,food,furniture}
          curl -L --fail --retry 3 -o build/market.zip 'https://www.kenney.nl/media/pages/assets/mini-market/463f38da51-1729865423/kenney_mini-market.zip'
          curl -L --fail --retry 3 -o build/characters.zip 'https://kenney.nl/media/pages/assets/mini-characters/bfc7e272b4-1774770718/kenney_mini-characters.zip'
          curl -L --fail --retry 3 -o build/building.zip 'https://kenney.nl/media/pages/assets/building-kit/0de7aaa492-1743244741/kenney_building-kit.zip'
          curl -L --fail --retry 3 -o build/food.zip 'https://www.kenney.nl/media/pages/assets/food-kit/83086fa91c-1719418518/kenney_food-kit.zip'
          curl -L --fail --retry 3 -o build/furniture.zip 'https://kenney.nl/media/pages/assets/furniture-kit/440e0608a4-1677580847/kenney_furniture-kit.zip'
          curl -L --fail --retry 3 -o build/vehicles.zip 'https://kenney.nl/media/pages/assets/isometric-tiles-vehicles/34c07c3393-1677695121/kenney_isometric-vehicles.zip'
          unzip -q build/market.zip -d build/packs/market
          unzip -q build/characters.zip -d build/packs/characters
          unzip -q build/building.zip -d build/packs/building
          unzip -q build/food.zip -d build/packs/food
          unzip -q build/furniture.zip -d build/packs/furniture

      - name: Réintégrer les modèles 3D dans le jeu
        run: |
          python scripts/inject_assets.py \
            --template build/template.html \
            --output www/index.html \
            --market build/packs/market \
            --characters build/packs/characters \
            --building build/packs/building \
            --food build/packs/food \
            --furniture build/packs/furniture

      - name: Appliquer l'histoire et la gestion du magasin
        run: python scripts/apply_gameplay_patch.py --input www/index.html --output www/index.html

      - name: Corriger l'introduction mobile et ajouter le splash
        run: |
          cp build/branding/splash.jpg www/splash.jpg
          python scripts/fix_mobile_intro.py --input www/index.html --output www/index.html

      - name: Ajouter les véhicules Kenney de base
        run: |
          python scripts/mobile_gameplay_v3.py \
            --input www/index.html \
            --output www/index.html \
            --vehicles-zip build/vehicles.zip

      - name: Appliquer la refonte totale mobile V4
        run: |
          python scripts/refonte_totale_v4.py \
            --input www/index.html \
            --output www/index.html

      - name: Corriger les boutons tactiles et accélérer le rendu mobile V5
        run: |
          python scripts/mobile_hotfix_v5.py \
            --input www/index.html \
            --output www/index.html

      - name: Installer Capacitor et Three.js
        run: npm install --no-audit --no-fund

      - name: Intégrer Three.js hors ligne
        run: cp node_modules/three/build/three.module.js www/three.module.js

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Appliquer l'icône et le splash Android
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          RES = getattr(Image, 'Resampling', Image).LANCZOS

          def cover(image, width, height):
              ratio = max(width / image.width, height / image.height)
              size = (round(image.width * ratio), round(image.height * ratio))
              image = image.resize(size, RES)
              left = max(0, (image.width - width) // 2)
              top = max(0, (image.height - height) // 2)
              return image.crop((left, top, left + width, top + height))

          icon = Image.open('build/branding/icon.jpg').convert('RGBA')
          splash = Image.open('build/branding/splash.jpg').convert('RGB')
          icon.load(); splash.load()
          print('✓ Sources branding valides :', icon.size, splash.size)

          legacy = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          adaptive = {'mdpi':108, 'hdpi':162, 'xhdpi':216, 'xxhdpi':324, 'xxxhdpi':432}

          for density, size in legacy.items():
              out = Path(f'android/app/src/main/res/mipmap-{density}')
              out.mkdir(parents=True, exist_ok=True)
              img = cover(icon, size, size)
              img.save(out / 'ic_launcher.png', format='PNG', optimize=True)
              img.save(out / 'ic_launcher_round.png', format='PNG', optimize=True)

          for density, size in adaptive.items():
              out = Path(f'android/app/src/main/res/mipmap-{density}')
              out.mkdir(parents=True, exist_ok=True)
              inner = round(size * 0.72)
              fg = cover(icon, inner, inner)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(fg, ((size-inner)//2, (size-inner)//2))
              canvas.save(out / 'ic_launcher_foreground.png', format='PNG', optimize=True)

          splash = cover(splash, 1080, 1920)
          out = Path('android/app/src/main/res/drawable')
          out.mkdir(parents=True, exist_ok=True)
          splash.save(out / 'splash.png', format='PNG', optimize=True)
          print('✓ Icône Android et splash générés')
          PY

      - name: Compiler l'APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Préparer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mini-Marche-3D.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Marche-3D-APK
          path: Mini-Marche-3D.apk
          if-no-files-found: error
          retention-days: 30
